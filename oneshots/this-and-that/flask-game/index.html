<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoltan's Flask: Experiment 47</title>
<style>
:root{--ink:#2b2116;--paper:#f3e6c8;--paper2:#e7d4aa;--wood:#2a1d14;--accent:#7a3b1d;--ok:#3f6b35;--bad:#8a2f2f}
*{box-sizing:border-box}
body{margin:0;background:var(--wood);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--paper);border-radius:14px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
h1{margin:0;font-size:26px;letter-spacing:.5px}
.sub{margin:2px 0 10px;font-style:italic;color:#5b4630}
.stage{position:relative;width:100%;aspect-ratio:1/1;margin:6px auto 10px;max-width:420px}
.stage>*{position:absolute;inset:0;width:100%;height:100%}
.stage img{color:transparent}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.chip{border:1.5px dashed #9c8461;border-radius:10px;padding:6px 4px;text-align:center;font-size:13px;min-height:52px;background:var(--paper2)}
.chip b{display:block;font-size:12px;letter-spacing:1px;color:#6b5236;text-transform:uppercase}
.chip.done{border-style:solid;border-color:var(--ok);background:#e3ecd0}
form{display:flex;gap:6px}
input{flex:1;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:1.5px solid #9c8461;background:#fffaf0}
button{font:inherit;font-size:16px;padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff8ec;cursor:pointer}
button.big{width:100%;margin-top:10px;font-size:19px;padding:14px}
.note{min-height:48px;margin-top:10px;padding:10px 12px;border-left:4px solid var(--accent);background:#fbf3df;font-style:italic;border-radius:0}
.note.bad{border-left-color:var(--bad)}
.desc{margin:8px 0 0;padding-left:18px;line-height:1.5}
.reset{display:block;margin:14px auto 0;background:none;color:#6b5236;font-size:13px;text-decoration:underline;padding:4px}
.foot{text-align:center;color:#c9b48e;font-size:12px;margin:12px 0 4px}
.foot img{height:34px;display:block;margin:0 auto 4px;opacity:.85}
.shake{animation:shake .6s 3}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.6) translateY(30%);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.pet{animation:petb 1s ease-in-out infinite}
@keyframes petb{0%,100%{transform:translateY(0) scale(.6)}50%{transform:translateY(-10%) scale(.62,.58)}}
.hidden{display:none}
.hz{animation:hz 2.4s ease-in-out infinite}@keyframes hz{0%,100%{opacity:.8}50%{opacity:1}}
.pl{animation:pl 1.4s ease-in-out infinite}@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.tw{animation:tw 1.8s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}

.stage{border-radius:12px;overflow:hidden;background:#1a120b url(img/bench-bg.webp) center/cover no-repeat;box-shadow:inset 0 0 40px rgba(0,0,0,.7)}
.stage .shadow{position:absolute;left:22%;right:22%;top:auto;bottom:13%;height:7%;width:auto;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));inset:auto 22% 13% 22%}
.stage canvas{pointer-events:none}
.stage .body{transform-origin:50% 80%;will-change:transform}
.stage .body>img{position:absolute;inset:0;width:100%;height:100%}
.stage.flaskmode .body{transform-origin:50% 84%}
</style>
</head>

const FX=(()=>{const P=2.6;let S=null,raf=0;

   c.strokeStyle=a==='rainbow'?hue(t*1.5,k*40).replace('62%)',`62%,${0.22*pulse})`).replace('hsl','hsla'):rgba(COL[a][k===2?0:k],0.22*pulse);c.shadowColor=a==='rainbow'?hue(t,0):rgba(COL[a][0],1);c.shadowBlur=W*0.06;c.stroke()}
  c.shadowBlur=0;
  for(const p of S.parts){p.life+=0.006*p.sp;if(p.life>1)Object.assign(p,newPart(false));
   const L=p.life,fade=Math.sin(L*Math.PI),col=a==='rainbow'?null:COL[a][p.i];let x,y,r;
   if(a==='ember'){x=p.x+Math.sin(t*6+p.o)*0.008+p.nx*L*0.03;y=p.y-L*0.22;r=W*0.03*p.sz*(1-L*0.5);
     const g=c.createRadialGradient(x*W,y*W,0,x*W,y*W,r*2.2);g.addColorStop(0,rgba(COL.ember[1],0.9*fade));g.addColorStop(0.4,rgba(col,0.55*fade));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.beginPath();c.ellipse(x*W,y*W,r*1.2,r*2.2,0,0,7);c.fill()}
   else if(a==='frost'){const an=p.ang+t*0.35*p.sp+L*0.8,rr=p.rad+Math.sin(t+p.o)*0.01;x=S.sil.cx+Math.cos(an)*rr*1.02;y=S.sil.cy+Math.sin(an)*rr*1.05;r=W*0.008*p.sz;
     c.fillStyle=rgba(col,0.85*fade);c.beginPath();c.arc(x*W,y*W,r,0,7);c.fill();
     if(p.i===1){c.strokeStyle=rgba(COL.frost[1],0.8*fade);c.lineWidth=1;c.save();c.translate(x*W,y*W);c.rotate(t*0.6+p.o);for(let j=0;j<3;j++){c.rotate(Math.PI/3);c.beginPath();c.moveTo(-r*2.6,0);c.lineTo(r*2.6,0);c.stroke()}c.restore()}}
   else if(a==='storm'){const an=p.ang+t*0.6*p.sp;x=S.sil.cx+Math.cos(an)*p.rad;y=S.sil.cy+Math.sin(an)*p.rad;r=W*0.006*p.sz;c.fillStyle=rgba(col,0.9*fade);c.beginPath();c.arc(x*W,y*W,r,0,7);c.fill()}
   else {const an=p.ang+t*0.5*p.sp;x=S.sil.cx+Math.cos(an)*p.rad;y=S.sil.cy+Math.sin(an)*p.rad*1.05;r=W*0.012*p.sz;c.fillStyle=hue(t*2,p.o).replace('hsl','hsla').replace('62%)',`62%,${0.8*fade})`);c.beginPath();c.arc(x*W,y*W,r,0,7);c.fill()}}
  if(a==='storm'){if(t-S.lastBolt>0.09+Math.random()*0.25){S.lastBolt=t;S.bolts.push({a:rpt(),life:1,seg:mkBolt()})}
   for(const bo of S.bolts){bo.life-=0.08;c.strokeStyle=a==='rainbow'?hue(t*3,0):rgba(COL.storm[1],bo.life);c.lineWidth=W*0.009*bo.life+1;c.shadowColor=rgba(COL.storm[0],1);c.shadowBlur=W*0.03;c.beginPath();bo.seg.forEach((q,i)=>i?c.lineTo(q[0]*W,q[1]*W):c.moveTo(q[0]*W,q[1]*W));c.stroke()}
   S.bolts=S.bolts.filter(b=>b.life>0);c.shadowBlur=0}
  /* keep the aura OUTSIDE the body so it never smears over it */
  c.globalCompositeOperation='destination-out';path(c,S.sil.pts,W);c.fillStyle='rgba(0,0,0,.85)';c.fill();
  c.restore();c.globalCompositeOperation='source-over'}
 function mkBolt(){const p=rpt(),cx=S.sil.cx,cy=S.sil.cy,dx=p[0]-cx,dy=p[1]-cy,L=Math.hypot(dx,dy),nx=dx/L,ny=dy/L;const seg=[[p[0]+nx*0.01,p[1]+ny*0.01]];let x=seg[0][0],y=seg[0][1];
  const tx=-ny,ty=nx,dir=Math.random()<.5?1:-1;for(let i=0;i<8;i++){x+=tx*dir*0.04+nx*(Math.random()-.3)*0.04;y+=ty*dir*0.035+ny*(Math.random()-.3)*0.04;seg.push([x,y])}return seg}
 function drawFront(t,s,W,xf){const c=S.f.getContext('2d');c.clearRect(0,0,W,W);const d=S.st.dust;
  /* flask: bubbles rise through the liquid */
  if(S.m==='flask'&&S.st.essence){xf(c);S.bub=S.bub||Array.from({length:14},()=>({x:0.38+Math.random()*0.24,y:0.82-Math.random()*0.3,v:0.0015+Math.random()*0.002,r:0.004+Math.random()*0.008}));
   for(const b of S.bub){b.y-=b.v;b.x+=Math.sin(t*3+b.r*900)*0.0006;if(b.y<0.56){b.y=0.82;b.x=0.36+Math.random()*0.28}
    c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;c.beginPath();c.arc(b.x*W,b.y*W,b.r*W,0,7);c.stroke()}c.restore()}
  if(!d)return;c.globalCompositeOperation='lighter';
  for(const p of S.spark){p.life+=0.004;p.x+=p.vx*0.1+Math.sin(t+p.ph)*0.0004;p.y+=p.vy*0.1;if(p.life>1||p.y<0.05)Object.assign(p,newSpark(false));
   const tw=Math.max(0,Math.sin(t*p.tw+p.ph))**4*Math.sin(p.life*Math.PI),r=W*0.02*p.sz*(0.4+tw);
   const col=d==='rainbow'?null:COL[d][p.i];const fs=d==='rainbow'?hue(t*2,p.o).replace('hsl','hsla').replace('62%)',`62%,${tw})`):rgba(col,tw);
   c.fillStyle=fs;c.beginPath();c.arc(p.x*W,p.y*W,r*0.35,0,7);c.fill();
   c.strokeStyle=fs;c.lineWidth=Math.max(1,r*0.12);c.beginPath();c.moveTo(p.x*W-r,p.y*W);c.lineTo(p.x*W+r,p.y*W);c.moveTo(p.x*W,p.y*W-r);c.lineTo(p.x*W,p.y*W+r);c.stroke()}
  c.globalCompositeOperation='source-over'}
 return {attach}})();

function render(el,m,st){const anyR=CATS.some(c=>st[c]==='rainbow');
 const body=['essence','ichor','heart','BASE','FACE','skin'].map(c=>c==='FACE'?(m==='ooze'?IMG(anyR?'ooze-face-happy':'ooze-face-angry'):''):c==='BASE'?IMG(m==='flask'?'flask-blank':(anyR?'ooze-blank-happy':'ooze-blank-angry')):(st[c]?IMG(`${m}-${c}-${st[c]}`,ANIM[c]||''):'')).join('');
 el.classList.toggle('flaskmode',m==='flask');
 el.innerHTML=`<div class="shadow"></div><canvas class="fxb"></canvas><div class="body">${body}</div><canvas class="fxf"></canvas>`;
 FX.attach(el,m,st)}
(function preload(){const L=['flask-blank','ooze-blank-angry','ooze-blank-happy','ooze-face-angry','ooze-face-happy','rainbow-pet'];
 for(const m of ['flask','ooze'])for(const c of CATS)for(const v in V[c])L.push(`${m}-${c}-${v}`);
 let i=0;const next=()=>{if(i>=L.length)return;const im=new Image(),src=L[i++];let t=0;
  im.onload=next;im.onerror=()=>{if(++t<4)setTimeout(()=>{im.src=`img/${src}.webp?p=${t}`},500*t);else next()};im.src=`img/${src}.webp`};
 for(let k=0;k<4;k++)next()})();
const $=id=>document.getElementById(id);
function chips(){$('chips').innerHTML=CATS.map(c=>S[c]?`<div class="chip done"><b>${LABEL[c]}</b>${V[c][S[c]][0]}</div>`:`<div class="chip"><b>${LABEL[c]}</b>?</div>`).join('')}
function note(t,bad){const n=$('note');n.textContent=t;n.className='note'+(bad?' bad':'')}
function refresh(){chips();render($('flaskStage'),'flask',S);const all=CATS.every(c=>S[c]);$('pour').classList.toggle('hidden',!all||S.poured);$('f').classList.toggle('hidden',all);if(S.poured)showResult(false)}
$('f').addEventListener('submit',e=>{e.preventDefault();const raw=$('pw').value,k=norm(raw);
 if(!k){note('Type the name your GM gave you first.',true);return}
 const hit=LOOK[k];if(!hit){note('Zoltan squints at the label. "That\'s not one of mine. Check the name with your GM."',true);return}
 const [c,v]=hit;if(S[c]){note(`You've already added the ${LABEL[c]}. Zoltan only keeps one jar of each.`,true);return}
 S[c]=v;save();$('pw').value='';note(NOTE[c][v]);refresh();
 if(CATS.every(x=>S[x]))note('All six are in. Something in the flask just blinked. Pour it into the cauldron!')});
$('pw').addEventListener('input',()=>{if($('note').classList.contains('bad'))note('Type the ingredient your GM names.')});
$('pour').addEventListener('click',()=>{const fs=$('flaskStage');fs.classList.add('shake');$('pour').classList.add('hidden');note('The bubbles stop. Everything goes very quiet...');
 setTimeout(()=>{fs.classList.remove('shake');S.poured=true;save();showResult(true)},1900)});
function showResult(anim){const rain=CATS.every(c=>S[c]==='rainbow');$('flaskStage').classList.add('hidden');const os=$('oozeStage');os.classList.remove('hidden');
 if(rain){os.innerHTML=IMG('rainbow-pet','pet');os.classList.add('pop')}
 else{render(os,'ooze',S);if(anim)os.classList.add('pop')}
 
 $('play').classList.add('hidden');$('result').classList.remove('hidden');
 $('rtitle').textContent=rain?'A tiny rainbow blob climbs over the rim, blinks, squeaks... and bounces straight into your arms. It has chosen you.':'Something translucent and thoroughly gelatinous climbs over the rim. Your Flubb is loose! Your GM has its stats. Good luck.';
 $('rdesc').innerHTML=rain?'<li>It is harmless and very affectionate.</li><li>It talks in squeaks, colour changes and bounces.</li><li>It wants to come home with you.</li>':['essence','heart','skin','ichor','dust','aura'].map(c=>`<li>${DESC[c][S[c]]}</li>`).join('')}
let armed=false;$('reset').addEventListener('click',()=>{if(!armed){armed=true;$('reset').textContent='Tap again to empty the flask';setTimeout(()=>{armed=false;$('reset').textContent='Empty the flask and start again'},4000);return}
 S={};save();armed=false;$('reset').textContent='Empty the flask and start again';$('result').classList.add('hidden');$('play').classList.remove('hidden');$('oozeStage').className='stage hidden';$('flaskStage').classList.remove('hidden');note('Fresh flask. Search Zoltan\'s stores and type each ingredient your GM names.');refresh()});
refresh();
</script>
