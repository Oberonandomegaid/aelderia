<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Great Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--gold:#e7c27a;--ink:#2b1d14;--glow:#bfe3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0b14;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#backdrop{position:fixed;inset:-40px;background:url(img/archives-bg.webp) center/cover;filter:blur(24px) brightness(.45)}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,66.667vh);height:min(150vw,100vh);overflow:hidden;background:#000;box-shadow:0 0 60px #000}
.scene{position:absolute;inset:0;transition:opacity 1s}
#world{position:absolute;inset:0;transform-origin:72% 30%}
.abs{position:absolute;display:block;pointer-events:none}
img.abs{height:auto}
#bg{left:0;top:0;width:100%;height:100%;object-fit:cover}
#orbs span{position:absolute;width:2.2%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0,#bfe3ff 30%,rgba(140,190,255,0) 70%);animation:orb 6s ease-in-out infinite;opacity:.8}
@keyframes orb{50%{transform:translateY(-14px);opacity:1}}
#motes i{position:absolute;width:.5%;aspect-ratio:1;border-radius:50%;background:#d8efff;opacity:0;animation:mote 9s linear infinite}
@keyframes mote{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}100%{opacity:0;transform:translateY(-160px) translateX(30px)}}
/* egg */
#eggwrap{left:38.8%;top:57.7%;width:20%;aspect-ratio:454/600;transform-origin:50% 92%}
#eggwrap.idle{animation:rock 4.5s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(0)}20%{transform:rotate(1.6deg)}40%{transform:rotate(-1.2deg)}55%{transform:rotate(.4deg)}}
#eggwrap.wobble{animation:wob .7s ease-in-out}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}}
#eggwrap .layer{position:absolute;inset:0;background:url(img/egg.webp) center/100% 100% no-repeat}
#shimmer{position:absolute;inset:0;-webkit-mask:url(img/egg.webp) center/100% 100% no-repeat;mask:url(img/egg.webp) center/100% 100% no-repeat;background:linear-gradient(115deg,transparent 35%,rgba(255,250,225,.55) 48%,transparent 60%) 0 0/300% 100%;animation:shine 5s ease-in-out infinite;mix-blend-mode:screen}
@keyframes shine{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
#pulse{position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(ellipse at 50% 55%,rgba(255,215,150,.25),transparent 65%);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(1.04)}}
#cracks{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#cracks path{fill:none;stroke:#1a0802;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(255,240,210,1)) drop-shadow(0 0 1px #fff)}
#eggTop{clip-path:polygon(0 0,100% 0,100% 47%,90% 42%,80% 49%,70% 41%,60% 48%,50% 40%,40% 47%,30% 41%,20% 49%,10% 42%,0 47%)}
#eggBot{clip-path:polygon(0 47%,10% 42%,20% 49%,30% 41%,40% 47%,50% 40%,60% 48%,70% 41%,80% 49%,90% 42%,100% 47%,100% 100%,0 100%)}
#beak{position:absolute;left:44%;top:32%;width:12%;height:9%;background:linear-gradient(135deg,#ffd27a,#e98a2e);clip-path:polygon(0 100%,50% 0,100% 100%);opacity:0;transform:translateY(40%)}
.frag{position:absolute;width:22%;height:16%;background:url(img/egg.webp) no-repeat;background-size:460% 625%}
/* desk */
#desk{left:0;top:58.67%;width:100%}
/* bird */
.bird{position:absolute;width:40%;aspect-ratio:1;left:28.8%;top:49.6%;pointer-events:auto;touch-action:none}
.bird .mover,.bird .breath{position:absolute;inset:0;transform-origin:50% 92%}
.bird .breath{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,.975)}}
.bird img{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.bird[data-f=idle] .f-idle,.bird[data-f=blink] .f-blink,.bird[data-f=chirp] .f-chirp,.bird[data-f=fly] .f-fly{opacity:1}
.bird.hidden{visibility:hidden}
.fx{position:absolute;pointer-events:none;font-size:calc(var(--u)*6);color:#ffb3c7;text-shadow:0 0 6px rgba(255,255,255,.8);animation:floatup 1.6s ease-out forwards}
.fx.spark{color:#d7f0ff}
@keyframes floatup{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--u)*-14)) scale(1.1)}}
#treat{width:9%;opacity:0}
.crumb{position:absolute;width:1%;aspect-ratio:1;border-radius:40%;background:#c98a3d}
/* shelf scene */
#shelfScene{opacity:0}
#shelfWorld{position:absolute;inset:0}
#shelf{left:0;top:0;width:100%;height:100%;object-fit:cover}
#fist{width:110%;left:105%;top:26%}
.feather{position:absolute;width:15%;pointer-events:none;z-index:6;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.comic{position:absolute;font-family:Bangers,Impact,'Arial Black',sans-serif;letter-spacing:.04em;color:#ffe14d;-webkit-text-stroke:calc(var(--u)*.7) #8b1a10;paint-order:stroke fill;text-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 #3a0a05;pointer-events:none;opacity:0;white-space:nowrap}
.burst{position:absolute;background:#fff4c2;clip-path:polygon(50% 0,61% 30%,95% 12%,74% 42%,100% 55%,70% 62%,84% 96%,55% 74%,38% 100%,34% 70%,3% 84%,24% 56%,0 36%,30% 34%,18% 4%);opacity:0;pointer-events:none}
#tableNote{position:absolute;left:0;right:0;bottom:6%;text-align:center;font:italic calc(var(--u)*4.4) 'IM Fell English',Georgia,serif;color:#f3e6c8;text-shadow:0 2px 6px #000;opacity:0;transition:opacity 2.5s}
.shake{animation:shake .45s linear}
@keyframes shake{10%{transform:translate(-3%,2%)}25%{transform:translate(3%,-2%)}40%{transform:translate(-2%,1%)}60%{transform:translate(2%,-1%)}80%{transform:translate(-1%,0)}}
/* UI */
.panel{position:absolute;left:4%;right:4%;bottom:3%;padding:3.2% 3.6%;border-radius:calc(var(--u)*3);background:linear-gradient(rgba(36,24,16,.84),rgba(24,16,12,.9));border:1px solid rgba(231,194,122,.55);box-shadow:0 6px 20px rgba(0,0,0,.55),inset 0 0 18px rgba(191,227,255,.08);transition:opacity .5s,transform .5s}
.panel.off{opacity:0;transform:translateY(20%);pointer-events:none}
.label{font:500 calc(var(--u)*4.6) Cinzel,Georgia,serif;color:var(--gold);text-align:center;margin:0 0 2.2%;letter-spacing:.06em}
.row{display:flex;gap:2.4%}
input.t{flex:1;min-width:0;font:calc(var(--u)*5) 'IM Fell English',Georgia,serif;padding:2.4% 3.4%;border-radius:calc(var(--u)*2);border:1px solid #b8955a;background:#f6ecd6;color:var(--ink);outline:none}
input.t:focus{box-shadow:0 0 0 3px rgba(191,227,255,.45)}
button.b{font:700 calc(var(--u)*4) Cinzel,Georgia,serif;letter-spacing:.04em;color:#2b1d14;background:linear-gradient(#f2d793,#c99a4a);border:1px solid #7a5523;border-radius:calc(var(--u)*2);padding:2.6% 3.8%;box-shadow:0 2px 0 #6a4518;cursor:pointer}
button.b:active{transform:translateY(2px);box-shadow:none}
#msg{min-height:calc(var(--u)*5);margin:2% 0 0;text-align:center;font:italic calc(var(--u)*3.9) 'IM Fell English',Georgia,serif;color:#f1dfb8}
#acts{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*2)}
#acts button{padding:3.2% 0}
#givebox{margin-top:2.6%;display:none}
#givebox.on{display:flex}
#mute{position:absolute;right:3%;top:2%;width:11%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(231,194,122,.6);background:rgba(20,14,10,.6);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20}
#mute svg{width:55%;height:55%}
#gmhot{position:absolute;left:0;top:0;width:16%;aspect-ratio:1;z-index:21}
#gm{position:absolute;inset:12% 8% auto;z-index:30;background:rgba(14,12,20,.95);border:1px solid #6b8fb3;border-radius:calc(var(--u)*3);padding:5%;display:none;font:calc(var(--u)*3.8) Georgia,serif;color:#dfe9f5}
#gm.on{display:block}
#gm h3{margin:0 0 4%;font:700 calc(var(--u)*4.4) Cinzel,serif;color:#bfe3ff}
#gm button{display:block;width:100%;margin:0 0 3%;font:600 calc(var(--u)*4) Georgia,serif;padding:3.4%;border-radius:calc(var(--u)*2);border:1px solid #6b8fb3;background:#1d2a3a;color:#e8f2ff}
#gm button:disabled{opacity:.4}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0b14;color:var(--gold);font:calc(var(--u)*4.4) Cinzel,serif;z-index:40;transition:opacity .8s}
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="stage">
  <div class="scene" id="mainScene"><div id="world">
    <img id="bg" class="abs" src="img/archives-bg.webp" alt="">
    <div id="orbs" class="abs" style="inset:0"></div>
    <div id="motes" class="abs" style="inset:0"></div>
    <img id="desk" class="abs" src="img/desk.webp" alt="">
    <div id="eggwrap" class="abs idle">
      <div id="pulse"></div>
      <div class="layer" id="eggFull"></div>
      <div class="layer" id="eggBot" style="display:none"></div>
      <div id="beak"></div>
      <div class="layer" id="eggTop" style="display:none"></div>
      <div id="shimmer"></div>
      <svg id="cracks" viewBox="0 0 454 600" preserveAspectRatio="none">
        <path id="c1" d="M232 150 L218 196 L240 232 L226 262"/>
        <path id="c2" d="M0 282 L45 252 L91 294 L136 246 L182 282 L227 240 L272 288 L318 246 L363 294 L409 252 L454 282"/>
      </svg>
    </div>
    <img id="treat" class="abs" src="img/treat.webp" alt="">
  </div></div>
  <div class="scene" id="shelfScene"><div id="shelfWorld">
    <img id="shelf" class="abs" src="img/bookshelf.webp" alt="">
    <img id="fist" class="abs" src="img/fist.webp" alt="">
  </div></div>
  <div class="bird hidden" id="bird" data-f="idle"><div class="mover"><div class="breath">
    <img class="f-idle" alt=""><img class="f-blink" alt=""><img class="f-chirp" alt=""><img class="f-fly" alt="">
  </div></div></div>
  <div id="fxLayer" class="abs" style="inset:0;z-index:5"></div>
  <div class="burst" id="burst1"></div><div class="comic" id="boing">BOING!</div>
  <div class="burst" id="burst2"></div><div class="comic" id="splat">SPLAT!</div>
  <div id="flash"></div>
  <div id="tableNote">The story continues at your table…</div>

  <div class="panel" id="namePanel">
    <p class="label">Speak its name</p>
    <form class="row" id="nameForm" autocomplete="off"><input class="t" id="nameIn" maxlength="30" autocapitalize="words" enterkeyhint="go" aria-label="Speak its name"><button class="b" type="submit">Speak</button></form>
    <p id="msg"></p>
  </div>
  <div class="panel off" id="bondPanel">
    <div id="acts">
      <button class="b" data-a="stroke">Stroke</button><button class="b" data-a="nuzzle">Nuzzle</button><button class="b" data-a="nudge">Nudge</button>
      <button class="b" data-a="feed">Feed</button><button class="b" data-a="beak">Beak</button><button class="b" data-a="give">Say</button>
    </div>
    <form class="row" id="givebox" autocomplete="off"><input class="t" id="giveIn" maxlength="40" placeholder="What do you say?" enterkeyhint="send" aria-label="What do you say?"><button class="b" type="submit">Say</button></form>
  </div>

  <div id="mute" role="button" aria-label="Sound on or off"></div>
  <div id="gmhot"></div>
  <div id="gm">
    <h3>Archivist's controls</h3>
    <button data-g="reset">Reset to the egg</button>
    <button data-g="rehatch">Hatch again</button>
    <button data-g="bond">Back to the hatchling</button>
    <button data-g="splat">Replay the bookcase</button>
    <button data-g="sound">Sound on / off</button>
    <button data-g="close">Close</button>
  </div>
  <div id="loading">Opening the Archives…</div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s), stage=$('#stage'), bird=$('#bird'), mover=bird.querySelector('.mover');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
function fit(){stage.style.setProperty('--u',stage.clientWidth/100+'px')} addEventListener('resize',fit); fit();
// ---------- storage
const KEY='ga-genesis-egg';
const store={get(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}},set(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}};
// ---------- names (hashed so the list is never shown)
function fnv(s){let h=0x811c9dc5;for(const c of new TextEncoder().encode(s)){h^=c;h=Math.imul(h,0x01000193)>>>0}return h}
const NAMES={2779076476:'pipkin',3877175198:'fizzwick',2873127298:'solin',3248393017:'tuppence'}, BOOKCASE=3104904292;
const PERS={
 pipkin:{pitch:1.0,spd:1.0,hop:1.0,lean:.8,idle:['look','look','tilt','peer','blink','hop','wing','chirp']},
 fizzwick:{pitch:1.18,spd:1.35,hop:1.6,lean:.6,idle:['hop','hop','bounce','wing','tilt','blink','chirp','look']},
 solin:{pitch:.86,spd:.7,hop:.6,lean:.7,idle:['slowblink','slowblink','look','tilt','fluff','blink','softchirp']},
 tuppence:{pitch:1.04,spd:.9,hop:.8,lean:1.3,idle:['snuggle','fluff','blink','tilt','look','chirp','snuggle']}};
let who=null, P=PERS.pipkin, state='egg', busy=false, idleTimer=null, eggTimer=null, runId=0;
// ---------- preload
const imgs=['archives-bg','desk','egg','bookshelf','fist','treat'].map(n=>`img/${n}.webp`);
for(const b of Object.keys(PERS)) for(const f of ['idle','blink','chirp','fly']) imgs.push(`img/${b}-${f}.webp`);
for(let i=1;i<=8;i++) imgs.push(`img/feather${i}.webp`);
function load(src,t=0){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>t<3?setTimeout(()=>load(src,t+1).then(r),800):r(i);i.src=src})}
// ---------- ambience
const orbs=$('#orbs'), motes=$('#motes');
[[8,13],[30,9],[62,18],[84,27],[16,42],[72,48],[46,6],[90,60]].forEach(([x,y],i)=>{const s=document.createElement('span');s.style.left=x+'%';s.style.top=y/1.5+'%';s.style.animationDelay=(-i*0.8)+'s';orbs.appendChild(s)});
for(let i=0;i<18;i++){const m=document.createElement('i');m.style.left=rnd(5,95)+'%';m.style.top=rnd(20,80)+'%';m.style.animationDelay=(-rnd(0,9))+'s';m.style.animationDuration=rnd(7,12)+'s';motes.appendChild(m)}
// ---------- sound (all made in the browser)
let AC=null, master=null, muted=false, amb=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);startAmb()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function noiseBuf(sec=1){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}return b}
function whiteBuf(sec=.5){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function startAmb(){const n=AC.createBufferSource();n.buffer=noiseBuf(4);n.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;const g=AC.createGain();g.gain.value=.05;n.connect(f).connect(g).connect(master);n.start();amb=g;
  (function chime(){if(AC&&!muted){const t=AC.currentTime,o=AC.createOscillator(),gg=AC.createGain();o.type='sine';o.frequency.value=pick([1318,1568,1760,2093,2349]);gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(.025,t+.05);gg.gain.exponentialRampToValueAtTime(.0001,t+2.5);o.connect(gg).connect(master);o.start(t);o.stop(t+2.6)}setTimeout(chime,rnd(3500,8000))})()}
function tone(f0,f1,dur,vol=.18,type='sine',delay=0){if(!ac()||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02)}
function burstN(dur,freq,q,vol,delay=0,type='bandpass'){if(!ac()||muted)return;const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=whiteBuf(dur+.05);const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur+.05)}
const SFX={
 tap:(d=0)=>burstN(.05,2400,4,.5,d),
 crack:(d=0)=>{burstN(.12,1800,1.2,.7,d);burstN(.08,3500,2,.4,d+.05)},
 chirp:(k=1)=>{const p=P.pitch*k;tone(2300*p,3400*p,.11,.16);tone(2600*p,3900*p,.09,.13,'sine',.13)},
 softchirp:()=>{const p=P.pitch;tone(2000*p,2600*p,.16,.08)},
 trill:()=>{const p=P.pitch;for(let i=0;i<5;i++)tone(2500*p+i*80,3300*p+i*90,.06,.12,'sine',i*.075)},
 coo:()=>{const p=P.pitch;tone(900*p,1300*p,.22,.12,'triangle');tone(1300*p,1000*p,.2,.1,'triangle',.2)},
 peep:()=>{const p=P.pitch;tone(3000*p,2400*p,.12,.15);},
 surprise:()=>{const p=P.pitch;tone(2000*p,4200*p,.16,.17)},
 peck:(d=0)=>burstN(.03,3000,6,.35,d),
 hop:()=>{tone(320,180,.08,.12,'triangle')},
 flutter:(n=10)=>{for(let i=0;i<n;i++)burstN(.05,700,.8,.25,i*.06)},
 sparkle:()=>{for(let i=0;i<4;i++)tone(pick([2093,2637,3136,3520]),pick([2093,2637]),.25,.04,'sine',i*.06)},
 boing:()=>{if(!ac()||muted)return;const t=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(420,t+.08);o.frequency.exponentialRampToValueAtTime(160,t+.9);l.frequency.value=22;lg.gain.value=45;l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.45,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1);o.connect(g).connect(master);o.start(t);l.start(t);o.stop(t+1.05);l.stop(t+1.05)},
 splat:()=>{burstN(.35,500,.6,1.1,0,'lowpass');burstN(.18,1500,.7,.6,0);tone(110,40,.35,.6,'sine')}
};
const IC_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const IC_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function setMute(m){muted=m;$('#mute').innerHTML=m?IC_OFF:IC_ON;if(master)master.gain.value=m?0:1;const s=store.get();s.muted=m;store.set(s)}
$('#mute').addEventListener('click',e=>{e.stopPropagation();ac();setMute(!muted)});
addEventListener('pointerdown',()=>ac(),{once:false,passive:true});
// ---------- helpers
const A=(el,kf,o)=>el.animate(kf,Object.assign({duration:400,easing:'ease-in-out'},typeof o==='number'?{duration:o}:o)).finished.catch(()=>{});
function frame(f){bird.dataset.f=f}
function placeBird(x,y,w){bird.style.left=x+'%';bird.style.top=y/1.5+'%';bird.style.width=w+'%'}
function fx(ch,x,y,cls=''){const s=document.createElement('span');s.className='fx '+cls;s.textContent=ch;s.style.left=x+'%';s.style.top=y/1.5+'%';$('#fxLayer').appendChild(s);setTimeout(()=>s.remove(),1700)}
function hearts(n=3){const r=bird.getBoundingClientRect(),st=stage.getBoundingClientRect();for(let i=0;i<n;i++)setTimeout(()=>fx(pick(['♥','♥','✦']),((r.left-st.left)/st.width*100)+rnd(15,75),((r.top-st.top)/st.height*150)+rnd(0,20),Math.random()<.3?'spark':''),i*180)}
